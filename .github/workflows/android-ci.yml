name: Android CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-ci.yml'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-unit-release:
    name: Unit tests + Release build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Assemble Release (debug signing for CI)
        run: ./gradlew :app:assembleRelease -PreleaseArm64Only=true -PuseDebugSigning --no-daemon

      - name: ROM matrix gate (hint)
        run: bash scripts/rom-matrix-gate.sh
