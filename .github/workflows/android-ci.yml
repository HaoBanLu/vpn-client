# ARCHIVED 2026-08-07：Android 发版已迁至 apps/tauri（app-release.yml）。
# 本 workflow 仅保留手动触发，便于对照历史 Compose 工程，勿作新版本门禁。
name: Android CI (archived)

on:
  workflow_dispatch:

concurrency:
  group: android-ci-archived-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notice:
    name: Archived notice
    runs-on: ubuntu-latest
    steps:
      - name: apps/android is archived
        run: |
          echo "apps/android 已存档，不再作为发版/PR 门禁。"
          echo "请使用 apps/tauri：npm run tauri:android:build:release"
          echo "Tag 发版见 .github/workflows/app-release.yml"
          exit 1
