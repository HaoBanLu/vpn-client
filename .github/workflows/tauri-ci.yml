name: Tauri Desktop CI

on:
  push:
    paths:
      - 'apps/tauri/**'
      - 'frontend/shared/**'
      - '.github/workflows/tauri-ci.yml'
      - 'scripts/ci/prepare-tauri-release-build.mjs'
  pull_request:
    paths:
      - 'apps/tauri/**'
      - 'frontend/shared/**'
      - '.github/workflows/tauri-ci.yml'
      - 'scripts/ci/prepare-tauri-release-build.mjs'

concurrency:
  group: tauri-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tauri-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/tauri/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build

  tauri-rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tauri/src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check

  tauri-linux-build:
    name: Linux desktop (deb)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/tauri/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/tauri/src-tauri

      - run: npm ci
      # CI 无 updater 私钥时关闭 createUpdaterArtifacts（与 App Release 一致）
      - name: Prepare Tauri CI build
        run: node ../../scripts/ci/prepare-tauri-release-build.mjs .
      - run: npm run tauri:linux:build

  tauri-macos-build:
    name: macOS desktop (dmg)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/tauri
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/tauri/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/tauri/src-tauri

      - run: npm ci
      - name: Prepare Tauri CI build
        run: node ../../scripts/ci/prepare-tauri-release-build.mjs .
      - run: npm run tauri:mac:build

  tauri-windows-build:
    name: Windows desktop (nsis)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/tauri
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/tauri/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/tauri/src-tauri

      - name: Build Windows installer (CI smoke)
        env:
          VITE_API_BASE_URL: https://example.com/api
        run: |
          npm ci
          node ../../scripts/ci/prepare-tauri-release-build.mjs .
          npm run tauri:win:build

  tauri-ios-build:
    name: iPhone (Simulator xcodebuild)
    runs-on: macos-latest
    # Network Extension 无签名 Simulator 常 exit 65；正式 IPA 由 app-release 负责
    continue-on-error: true
    defaults:
      run:
        working-directory: apps/tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew untap aws/tap 2>/dev/null || true
          brew install xcodegen

      # 仅验证工程可生成，避免 NE 无签名 xcodebuild 污染门禁
      - name: Generate Xcode project
        run: |
          bash scripts/fetch-mihomo-ios.sh
          bash scripts/setup-mihomo-ios-native.sh
          (cd platforms/ios && xcodegen generate)
          test -d platforms/ios/KuayunVPN.xcodeproj
