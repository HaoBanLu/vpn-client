name: KuayunVPN
options:
  bundleIdPrefix: com.vpn.kuayun
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.2.21"
    CURRENT_PROJECT_VERSION: "141"

targets:
  KuayunVPN:
    type: application
    platform: iOS
    sources:
      - path: KuayunVPN
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vpn.kuayun.app
        INFOPLIST_KEY_CFBundleDisplayName: ���� VPN
        INFOPLIST_KEY_API_BASE_URL: https://vpn.example.com/api/v1
        CODE_SIGN_ENTITLEMENTS: KuayunVPN/KuayunVPN.entitlements
    entitlements:
      path: KuayunVPN/KuayunVPN.entitlements
    info:
      path: KuayunVPN/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        API_BASE_URL: $(INFOPLIST_KEY_API_BASE_URL)
    dependencies:
      - target: PacketTunnel
        embed: true

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
        excludes:
          - Resources/**
      - path: Shared
    resources:
      - path: PacketTunnel/Resources
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vpn.kuayun.tunnel
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
    entitlements:
      path: PacketTunnel/PacketTunnel.entitlements
    info:
      path: PacketTunnel/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider

schemes:
  KuayunVPN:
    build:
      targets:
        KuayunVPN: all
    run:
      config: Debug
