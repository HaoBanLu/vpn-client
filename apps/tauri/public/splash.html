<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>跨云 · 正在启动</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0e17;
        color: #e8edf5;
        font-family: 'Segoe UI', system-ui, -apple-system, 'PingFang SC', sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: linear-gradient(180deg, #0a0e17 0%, #141b2d 100%);
      }
      .mark {
        width: 84px;
        height: 84px;
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 0 12px 40px rgba(37, 99, 235, 0.4);
        animation: pulse 1.5s ease-in-out infinite;
        background: #141b2d;
      }
      .mark img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 700;
      }
      .sub {
        margin: 0;
        font-size: 13px;
        color: #9aa8bc;
      }
      .spin {
        width: 28px;
        height: 28px;
        margin-top: 6px;
        border: 3px solid rgba(0, 212, 255, 0.18);
        border-top-color: #00d4ff;
        border-radius: 50%;
        animation: spin 0.75s linear infinite;
      }
      .status {
        margin: 2px 0 0;
        font-size: 14px;
        font-weight: 600;
        color: #7deaff;
      }
      .bar {
        width: 200px;
        height: 4px;
        margin-top: 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .bar > i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #0ea5e9, #00d4ff);
        animation: bar 1.1s ease-in-out infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }
      @keyframes bar {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(320%);
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap" data-tauri-drag-region>
      <div class="mark">
        <img src="splash-logo.png" width="84" height="84" alt="跨云" />
      </div>
      <h1>跨云</h1>
      <p class="sub">安全加速 · 全球互联</p>
      <div class="spin"></div>
      <p class="status" id="status">正在启动…</p>
      <div class="bar"><i></i></div>
    </div>
    <script>
      var tips = ['正在启动…', '正在加载组件…', '正在准备界面…', '即将完成…']
      var i = 0
      setInterval(function () {
        i = (i + 1) % tips.length
        document.getElementById('status').textContent = tips[i]
      }, 800)

      // 兜底：主窗口脚本若异常，超时后仍尝试进入主界面，避免卡在 Loading
      setTimeout(function () {
        try {
          if (window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke) {
            window.__TAURI__.core.invoke('boot_reveal_main')
          }
        } catch (e) {}
      }, 12000)
    </script>
  </body>
</html>
